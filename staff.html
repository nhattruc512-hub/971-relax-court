<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a7f47"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Thông báo nhận đơn"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.svg"><link rel="apple-touch-icon" href="icon-192.svg"><title>Thông báo nhận đơn</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="wrap"><div class="brand">971 RELAX COURT · NHÂN VIÊN</div><div class="sub">Nhận đơn và theo dõi doanh thu theo ngày</div></div></header><main class="wrap"><div class="card" id="installCard"><div class="top"><div><b>📲 Ứng dụng nhân viên</b><div class="muted">Cài lên màn hình điện thoại để mở như app.</div></div><button id="installBtn" class="primary" onclick="installApp()">CÀI APP</button></div><div id="iosHelp" class="muted hide" style="margin-top:8px">Trên iPhone/iPad: bấm Chia sẻ trong Safari → Thêm vào Màn hình chính.</div></div><div id="login" class="card"><label>PIN nhân viên</label><div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="Nhập PIN"><button class="primary" onclick="connect()">MỞ MÀN HÌNH ĐƠN</button></div></div><div id="panel" class="hide"><div class="top"><div id="state" class="muted">Đang kết nối...</div><button class="primary" onclick="enableNoti()">🔔 Bật thông báo</button></div><div class="card"><div class="row"><div><label>📅 Chọn ngày xem doanh thu & đơn hàng</label><input id="selectedDate" type="date" onchange="changeDate()"></div><div style="display:flex;align-items:end;gap:8px"><button class="ghost" style="width:100%" onclick="prevDay()">← Ngày trước</button><button class="primary" style="width:100%" onclick="todayBtn()">Hôm nay</button></div></div><div id="dateLabel" class="muted" style="margin-top:8px"></div></div><h2 id="revenueTitle">Doanh thu</h2><div id="kpis" class="kpis"></div><h2>Doanh thu theo ca</h2><div id="shifts" class="shifts"></div><h2 id="ordersTitle">Đơn hàng</h2><div id="orders"></div></div></main><script src="config.js"></script><script src="common.js"></script><script>
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});window.addEventListener('appinstalled',()=>{$('installCard').classList.add('hide');toast('Đã cài Thông báo nhận đơn')});async function installApp(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;return}if(/iphone|ipad|ipod/i.test(navigator.userAgent)){$('iosHelp').classList.remove('hide');return}toast('Mở menu trình duyệt và chọn Cài đặt ứng dụng / Thêm vào màn hình chính')}if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone==true)$('installCard').classList.add('hide');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
let pin=localStorage.getItem('r971pin')||'',timer=null,seen=new Set(),first=true;$('pin').value=pin;function localToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}$('selectedDate').value=localToday();function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=900;g.gain.value=.16;o.start();setTimeout(()=>o.stop(),380)}catch{}}async function enableNoti(){if(!('Notification'in window))return toast('Trình duyệt không hỗ trợ thông báo');const p=await Notification.requestPermission();toast(p==='granted'?'Đã bật thông báo':'Chưa cấp quyền')}function connect(){pin=$('pin').value.trim();localStorage.setItem('r971pin',pin);first=true;seen=new Set();load();if(timer)clearInterval(timer);timer=setInterval(load,3000)}function changeDate(){first=true;seen=new Set();load()}function prevDay(){const d=new Date($('selectedDate').value+'T12:00:00');d.setDate(d.getDate()-1);$('selectedDate').value=d.toISOString().slice(0,10);changeDate()}function todayBtn(){$('selectedDate').value=localToday();changeDate()}function dateVN(iso){return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(iso))}function timeVN(iso){return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(iso))}function pretty(v){const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}async function cancelOrder(id,code){if(!confirm('Hủy đơn '+code+'? Đơn đã hủy sẽ không tính vào doanh thu.'))return;try{await api('POST',{action:'cancel_order',pin,order_id:id});toast('Đã hủy đơn '+code);await load()}catch(e){toast(e.message)}}
async function load(){if(!pin)return;try{const selected=$('selectedDate').value||localToday(),d=await api('POST',{action:'staff',pin,selected_date:selected});$('login').classList.add('hide');$('panel').classList.remove('hide');$('dateLabel').textContent='Đang xem ngày '+pretty(d.selectedDate||selected);$('revenueTitle').textContent='Doanh thu ngày '+pretty(d.selectedDate||selected);$('ordersTitle').textContent='Đơn hàng ngày '+pretty(d.selectedDate||selected);$('state').textContent=d.isToday?'● Đang nhận đơn mới · cập nhật mỗi 3 giây':'● Đang xem dữ liệu ngày cũ';const orders=d.orders||[];if(d.isToday&&!first){const fresh=orders.find(o=>o.status!=='cancelled'&&!seen.has(o.id));if(fresh){beep();toast('🔔 CÓ ĐƠN MỚI: '+fresh.court);if(Notification.permission==='granted')new Notification('🥤 Có đơn mới',{body:`${fresh.court} · ${money(fresh.total)}`})}}first=false;seen=new Set(orders.map(o=>o.id));const s=d.stats||{};$('kpis').innerHTML=`<div class="kpi"><small>TỔNG DOANH THU</small><b>${money(s.totalRevenue)}</b></div><div class="kpi"><small>TỔNG SỐ ĐƠN</small><b>${s.totalOrders||0}</b></div><div class="kpi"><small>TIỀN MẶT</small><b>${money(s.cashRevenue)}</b></div><div class="kpi"><small>CHUYỂN KHOẢN/QR</small><b>${money(s.transferRevenue)}</b></div><div class="kpi" style="border-color:#fecaca;background:#fff7f7"><small>ĐƠN ĐÃ HỦY</small><b>${s.cancelledOrders||0} đơn</b><div class="muted">Giá trị: ${money(s.cancelledValue)}</div></div>`;$('shifts').innerHTML=(d.shiftStats||[]).map(x=>`<div class="shift"><h3>${x.name}</h3><div class="muted">${x.timeRange}</div><div class="rev">${money(x.totalRevenue)}</div><div class="muted">Số đơn: <b>${x.totalOrders}</b></div><div class="muted">Tiền mặt: <b>${money(x.cashRevenue)}</b></div><div class="muted">CK/QR: <b>${money(x.transferRevenue)}</b></div><div class="muted" style="margin-top:5px;color:#b91c1c">Đã hủy: <b>${x.cancelledOrders||0}</b> · ${money(x.cancelledValue)}</div></div>`).join('');$('orders').innerHTML=orders.length?orders.map(o=>{const cancelled=o.status==='cancelled';return `<div class="card order" style="${cancelled?'opacity:.68;border-left-color:#dc2626;background:#fff7f7':''}"><div class="top"><div><b style="font-size:20px">${o.court}</b><div class="muted">Mã đơn: ${o.order_code}</div><div class="muted">📅 Ngày đặt: <b>${dateVN(o.created_at)}</b> · 🕒 Giờ đặt: <b>${timeVN(o.created_at)}</b></div></div><div style="text-align:right"><b>${money(o.total)}</b><br>${cancelled?'<span class="pill" style="background:#fee2e2;color:#991b1b">❌ ĐÃ HỦY</span>':`<span class="pill ${o.payment_method==='cash'?'cash':'transfer'}">${o.payment_method==='cash'?'💵 TIỀN MẶT':'🏦 CHUYỂN KHOẢN'}</span>`}</div></div><div style="margin-top:8px">${(o.items||[]).map(x=>`<div><b>${x.qty}×</b> ${x.name}</div>`).join('')}</div>${o.customer_name?`<div class="muted" style="margin-top:7px">Khách: ${o.customer_name}</div>`:''}${o.customer_note?`<div class="card" style="background:#fffaf0;padding:9px;margin:8px 0 0"><b>📝 Ghi chú:</b> ${o.customer_note}</div>`:''}${o.payment_method==='transfer'?(o.payment_proof_url?`<a href="${o.payment_proof_url}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-top:10px;background:#dcfce7;color:#166534;border-radius:12px;padding:11px 13px;font-weight:850">🧾 XEM BILL CHUYỂN KHOẢN</a>`:`<div class="card" style="background:#fff7ed;color:#9a3412;padding:9px;margin:8px 0 0"><b>⚠️ Đơn cũ chưa có bill</b></div>`):''}${!cancelled?`<button style="margin-top:10px;background:#fee2e2;color:#991b1b;width:100%" onclick="cancelOrder('${o.id}','${o.order_code}')">HỦY ĐƠN</button>`:''}</div>`}).join(''):`<div class="card" style="text-align:center"><div style="font-size:40px">📭</div><b>Không có đơn trong ngày này</b></div>`}catch(e){toast(e.message);if(e.message.includes('PIN'))localStorage.removeItem('r971pin')}}if(pin)connect();
</script></body></html>
