<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>971 Relax Court - Nhân viên</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="wrap"><div class="brand">971 RELAX COURT · NHÂN VIÊN</div><div class="sub">Nhận đơn và theo dõi doanh thu</div></div></header><main class="wrap"><div id="login" class="card"><label>PIN nhân viên</label><div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="Nhập PIN"><button class="primary" onclick="connect()">MỞ MÀN HÌNH ĐƠN</button></div></div><div id="panel" class="hide"><div class="top"><div id="state" class="muted">Đang kết nối...</div><button class="primary" onclick="enableNoti()">🔔 Bật thông báo</button></div><h2>Doanh thu hôm nay</h2><div id="kpis" class="kpis"></div><h2>Doanh thu theo ca</h2><div id="shifts" class="shifts"></div><h2>Đơn hàng gần đây</h2><div id="orders"></div></div></main><script src="config.js"></script><script src="common.js"></script><script>
let pin=localStorage.getItem('r971pin')||'',timer=null,seen=new Set(),first=true;$('pin').value=pin;function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=900;g.gain.value=.16;o.start();setTimeout(()=>o.stop(),380)}catch{}}async function enableNoti(){if(!('Notification'in window))return toast('Trình duyệt không hỗ trợ thông báo');const p=await Notification.requestPermission();toast(p==='granted'?'Đã bật thông báo':'Chưa cấp quyền')}function connect(){pin=$('pin').value.trim();localStorage.setItem('r971pin',pin);first=true;seen=new Set();load();if(timer)clearInterval(timer);timer=setInterval(load,3000)}
async function load(){if(!pin)return;try{const d=await api('POST',{action:'staff',pin});$('login').classList.add('hide');$('panel').classList.remove('hide');$('state').textContent='● Đang nhận đơn · cập nhật mỗi 3 giây';const orders=d.orders||[];if(!first){const fresh=orders.find(o=>!seen.has(o.id));if(fresh){beep();toast('🔔 CÓ ĐƠN MỚI: '+fresh.court);if(Notification.permission==='granted')new Notification('🥤 Có đơn mới',{body:`${fresh.court} · ${money(fresh.total)} · ${fresh.payment_method==='cash'?'TIỀN MẶT':'CHUYỂN KHOẢN'}`})}}first=false;seen=new Set(orders.map(o=>o.id));const s=d.stats||{};$('kpis').innerHTML=`<div class="kpi"><small>TỔNG DOANH THU</small><b>${money(s.totalRevenue)}</b></div><div class="kpi"><small>TỔNG SỐ ĐƠN</small><b>${s.totalOrders||0}</b></div><div class="kpi"><small>TIỀN MẶT</small><b>${money(s.cashRevenue)}</b></div><div class="kpi"><small>CHUYỂN KHOẢN/QR</small><b>${money(s.transferRevenue)}</b></div>`;$('shifts').innerHTML=(d.shiftStats||[]).map(x=>`<div class="shift"><h3>${x.name}</h3><div class="muted">${x.timeRange}</div><div class="rev">${money(x.totalRevenue)}</div><div class="muted">Số đơn: <b>${x.totalOrders}</b></div><div class="muted">Tiền mặt: <b>${money(x.cashRevenue)}</b></div><div class="muted">CK/QR: <b>${money(x.transferRevenue)}</b></div></div>`).join('');$('orders').innerHTML=orders.map(o=>`<div class="card order"><div class="top"><div><b style="font-size:20px">${o.court}</b><div class="muted">${new Date(o.created_at).toLocaleString('vi-VN')} · ${o.order_code}</div></div><div><b>${money(o.total)}</b><br><span class="pill ${o.payment_method==='cash'?'cash':'transfer'}">${o.payment_method==='cash'?'💵 TIỀN MẶT':'🏦 CHUYỂN KHOẢN'}</span></div></div><div style="margin-top:8px">${(o.items||[]).map(x=>`<div><b>${x.qty}×</b> ${x.name}</div>`).join('')}</div>${o.customer_name?`<div class="muted" style="margin-top:7px">Khách: ${o.customer_name}</div>`:''}${o.customer_note?`<div class="card" style="background:#fffaf0;padding:9px;margin:8px 0 0"><b>📝 Ghi chú:</b> ${o.customer_note}</div>`:''}</div>`).join('')}catch(e){toast(e.message);if(e.message.includes('PIN'))localStorage.removeItem('r971pin')}}if(pin)connect();
</script></body></html>
