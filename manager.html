<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>971 Relax Court - Quản lý</title><link rel="stylesheet" href="styles.css"><style>.danger{background:#fee2e2;color:#991b1b}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status-new{border-left:5px solid #0a7f47}.status-delivered{border-left:5px solid #16a34a;background:#f0fdf4}.status-cancelled{border-left:5px solid #dc2626;background:#fff7f7;opacity:.8}@media(max-width:720px){.toolbar{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="wrap"><div class="brand">971 RELAX COURT · QUẢN LÝ</div><div class="sub">Theo dõi lịch sử đơn hàng và quản lý dữ liệu</div></div></header><main class="wrap"><div id="login" class="card"><label>Mã quản lý</label><div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="Nhập mã"><button class="primary" onclick="login()">MỞ TRANG QUẢN LÝ</button></div></div><div id="panel" class="hide"><div class="card"><div class="toolbar"><div><label>📅 Chọn ngày</label><input id="date" type="date" onchange="load()"></div><div><label>🔎 Tìm theo tên khách / mã đơn / sân</label><input id="search" placeholder="Ví dụ: Anh Nam, PICK1..." oninput="render()"></div></div></div><div id="stats" class="kpis"></div><div class="card"><div class="top"><div><b>Quản lý lịch sử</b><div class="muted">Xóa ở đây là xóa vĩnh viễn khỏi hệ thống.</div></div><button class="danger" onclick="deleteCancelledDay()">XÓA ĐƠN HỦY NGÀY NÀY</button></div><div class="sep"></div><div class="row"><div><label>Xóa toàn bộ lịch sử trước ngày</label><input id="beforeDate" type="date"></div><div style="display:flex;align-items:end"><button class="danger" style="width:100%" onclick="deleteBefore()">XÓA LỊCH SỬ CŨ</button></div></div></div><h2 id="title">Lịch sử đơn hàng</h2><div id="orders"></div></div></main><script src="config.js"></script><script src="common.js"></script><script>
const MANAGER_URL='https://dinqlgaveujdeyisgpty.supabase.co/functions/v1/r971-manager';let pin='',all=[];const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').value=today();
async function mgr(body){const r=await fetch(MANAGER_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.ANON_KEY,'apikey':CFG.ANON_KEY},body:JSON.stringify({...body,pin})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Không kết nối được');return d}
function login(){const entered=$('pin').value.trim();if(entered!=='270523'){toast('Mã quản lý không đúng');return}pin=String.fromCharCode(49,50,51,52);load()}
function dateVN(iso){return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(iso))}function timeVN(iso){return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(iso))}function pretty(v){const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
async function load(){try{if(!pin)return;const d=await mgr({action:'list',selected_date:$('date').value});$('login').classList.add('hide');$('panel').classList.remove('hide');all=d.orders||[];$('title').textContent='Lịch sử đơn hàng ngày '+pretty(d.selectedDate);const s=d.stats||{};$('stats').innerHTML=`<div class="kpi"><small>DOANH THU</small><b>${money(s.revenue)}</b></div><div class="kpi"><small>ĐƠN HỢP LỆ</small><b>${s.orders||0}</b></div><div class="kpi"><small>ĐÃ GIAO</small><b>${s.delivered||0}</b></div><div class="kpi"><small>ĐÃ HỦY</small><b>${s.cancelled||0}</b><div class="muted">${money(s.cancelledValue)}</div></div>`;render()}catch(e){toast(e.message)}}
function render(){const q=$('search').value.trim().toLowerCase();const arr=all.filter(o=>!q||String(o.customer_name||'').toLowerCase().includes(q)||String(o.order_code||'').toLowerCase().includes(q)||String(o.court||'').toLowerCase().includes(q));$('orders').innerHTML=arr.length?arr.map(o=>{const st=o.status||'new',cls=st==='cancelled'?'status-cancelled':st==='delivered'?'status-delivered':'status-new';const badge=st==='cancelled'?'❌ ĐÃ HỦY':st==='delivered'?'✅ ĐÃ GIAO':'🟢 ĐƠN MỚI';return `<div class="card order ${cls}"><div class="top"><div><b style="font-size:19px">${o.court} · ${o.customer_name||'Không tên'}</b><div class="muted">${o.order_code}</div><div class="muted">📅 ${dateVN(o.created_at)} · 🕒 ${timeVN(o.created_at)}</div></div><div style="text-align:right"><b>${money(o.total)}</b><br><span class="pill">${badge}</span></div></div><div style="margin-top:8px">${(o.items||[]).map(x=>`<div><b>${x.qty}×</b> ${x.name}</div>`).join('')}</div>${o.customer_note?`<div class="card" style="background:#fffaf0;padding:9px"><b>📝 Ghi chú:</b> ${o.customer_note}</div>`:''}${o.payment_method==='transfer'&&o.payment_proof_url?`<a href="${o.payment_proof_url}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-top:10px;background:#dcfce7;color:#166534;border-radius:12px;padding:11px 13px;font-weight:850">🧾 XEM BILL</a>`:''}<button class="danger" style="width:100%;margin-top:10px" onclick="deleteOrder('${o.id}','${o.order_code}')">🗑 XÓA VĨNH VIỄN ĐƠN NÀY</button></div>`}).join(''):`<div class="card" style="text-align:center"><b>Không có dữ liệu phù hợp</b></div>`}
async function deleteOrder(id,code){if(!confirm('Xóa vĩnh viễn đơn '+code+'? Thao tác này không thể hoàn tác.'))return;try{await mgr({action:'delete_order',order_id:id});toast('Đã xóa '+code);await load()}catch(e){toast(e.message)}}
async function deleteCancelledDay(){if(!confirm('Xóa vĩnh viễn toàn bộ đơn đã hủy của ngày '+pretty($('date').value)+'?'))return;try{const d=await mgr({action:'delete_cancelled_day',selected_date:$('date').value});toast('Đã xóa '+d.deleted+' đơn hủy');await load()}catch(e){toast(e.message)}}
async function deleteBefore(){const v=$('beforeDate').value;if(!v)return toast('Chọn ngày giới hạn trước');if(!confirm('Xóa TOÀN BỘ lịch sử đơn trước ngày '+pretty(v)+'? Thao tác này không thể hoàn tác.'))return;try{const d=await mgr({action:'delete_before',before_date:v});toast('Đã xóa '+d.deleted+' đơn cũ');await load()}catch(e){toast(e.message)}}
</script></body></html>
