<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>971 Relax Court - Gọi món</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="header"><div class="wrap"><div class="brand">971 RELAX COURT</div><div class="sub">Quét QR · Chọn món · Đặt ngay tại sân · Không cần đăng nhập</div></div></header><main class="wrap">
<div class="card"><div class="row"><div><label>Sân của bạn</label><select id="court"><option value="PICK1">Pickleball 1</option><option value="PICK2">Pickleball 2</option><option value="PICK3">Pickleball 3</option><option value="CL1">Cầu lông 1 - nền bê tông</option><option value="CL2">Cầu lông 2 - nền thảm</option></select></div><div><label>Tên khách (không bắt buộc)</label><input id="customer" placeholder="Ví dụ: Anh Nam"></div></div><label>Ghi chú cho nhân viên (không bắt buộc)</label><textarea id="note" placeholder="Ví dụ: giao sân 2, mang thêm ly..."></textarea></div>
<div class="tabs"><button id="tabDrink" class="active" onclick="switchTab('drink')">🥤 NƯỚC</button><button id="tabFood" class="ghost" onclick="switchTab('food')">🍞 ĐỒ ĂN</button></div><div id="menu"></div><div id="cart" class="cart hide"><div><b id="cartCount"></b><div id="cartTotal"></div></div><button class="orange" onclick="checkout()">THANH TOÁN</button></div></main>
<div id="checkout" class="modal hide"><div class="sheet"><div class="top"><div><b style="font-size:20px">Xác nhận đơn</b><div id="checkoutCourt" class="muted"></div></div><button class="ghost" onclick="$('checkout').classList.add('hide')">Đóng</button></div><div id="lines"></div><div class="sep"></div><div class="top"><b>Tổng tiền</b><div id="total" class="total"></div></div><div class="card"><label>Phương thức thanh toán</label><div class="row"><button id="btnTransfer" class="primary" onclick="setPayment('transfer')">🏦 Chuyển khoản / QR</button><button id="btnCash" class="ghost" onclick="setPayment('cash')">💵 Tiền mặt</button></div></div><div id="transferBox" class="card" style="text-align:center"><b>Quét QR MoMo để thanh toán</b><img id="momoQR" class="qr" alt="QR thanh toán MoMo"><div class="muted">Sau khi chuyển tiền, bấm nút đặt đơn bên dưới.</div></div><div id="cashBox" class="card hide" style="text-align:center;background:#fffaf0"><div style="font-size:45px">💵</div><b>Thanh toán tiền mặt</b><div class="muted">Nhân viên sẽ thu tiền khi giao món hoặc tại quầy.</div></div><button id="sendBtn" class="primary" style="width:100%;font-size:16px" onclick="sendOrder()">ĐÃ THANH TOÁN & ĐẶT ĐƠN</button></div></div>
<div id="success" class="modal hide"><div class="sheet" style="text-align:center"><div style="font-size:60px">✅</div><h2>ĐÃ GỬI ĐƠN!</h2><p id="successText"></p><button class="primary" onclick="location.reload()">GỌI THÊM</button></div></div>
<script src="config.js"></script><script src="common.js"></script><script>
let products=[],cart={},tab='drink',payment='transfer';const drinkCats=['NƯỚC SUỐI & KHOÁNG','NƯỚC NGỌT & TĂNG LỰC','TRÀ & NƯỚC GIẢI KHÁT','NƯỚC BÙ ĐIỆN GIẢI','BIA'];const foodCats=['ĐỒ ĂN','SỮA CHUA'];const MOMO_PAYLOAD='00020101021126220007vn.momo0207390652138630010A000000727013300069710250119PMC26228141000000190208QRIBFTTA53037045802VN6304E535';$('momoQR').src='https://quickchart.io/qr?size=450&text='+encodeURIComponent(MOMO_PAYLOAD);
const qp=new URLSearchParams(location.search);const qc=(qp.get('court')||'').toUpperCase();if([...$('court').options].some(o=>o.value===qc))$('court').value=qc;
function switchTab(t){tab=t;$('tabDrink').className=t==='drink'?'active':'ghost';$('tabFood').className=t==='food'?'active':'ghost';render()}
function setPayment(p){payment=p;$('transferBox').classList.toggle('hide',p!=='transfer');$('cashBox').classList.toggle('hide',p!=='cash');$('btnTransfer').className=p==='transfer'?'primary':'ghost';$('btnCash').className=p==='cash'?'primary':'ghost';$('sendBtn').textContent=p==='cash'?'ĐẶT ĐƠN - TRẢ TIỀN MẶT':'ĐÃ THANH TOÁN & ĐẶT ĐƠN'}
function cartLines(){return Object.entries(cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return {...p,qty,subtotal:p.price*qty}})}function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];render()}
function render(){const cats=tab==='drink'?drinkCats:foodCats;$('menu').innerHTML=cats.map(c=>{const ps=products.filter(p=>p.category===c);if(!ps.length)return'';return `<div class="section-title">${c}</div><div class="grid">${ps.map(p=>`<div class="card item"><div class="grow"><div class="name">${p.name}</div><div class="price">${money(p.price)}</div></div><div class="qty"><button class="ghost" onclick="chg('${p.id}',-1)">−</button><b>${cart[p.id]||0}</b><button class="primary" onclick="chg('${p.id}',1)">+</button></div></div>`).join('')}</div>`}).join('');refresh()}
function refresh(){const a=cartLines(),n=a.reduce((s,x)=>s+x.qty,0),t=a.reduce((s,x)=>s+x.subtotal,0);$('cart').classList.toggle('hide',!n);$('cartCount').textContent=n+' món';$('cartTotal').textContent=money(t)}function checkout(){const a=cartLines();if(!a.length)return;const t=a.reduce((s,x)=>s+x.subtotal,0);$('checkoutCourt').textContent='Sân '+$('court').value;$('lines').innerHTML=a.map(x=>`<div class="top" style="padding:6px 0"><span>${x.qty} × ${x.name}</span><b>${money(x.subtotal)}</b></div>`).join('');$('total').textContent=money(t);setPayment('transfer');$('checkout').classList.remove('hide')}
async function sendOrder(){const b=$('sendBtn');b.disabled=true;b.textContent='ĐANG GỬI...';try{const a=cartLines();const d=await api('POST',{action:'order',court:$('court').value,customer_name:$('customer').value.trim(),customer_note:$('note').value.trim(),items:a.map(x=>({id:x.id,qty:x.qty})),payment_method:payment});$('checkout').classList.add('hide');$('successText').innerHTML=`Mã đơn <b>${d.order_code}</b><br>Sân <b>${d.court}</b> · <b>${money(d.total)}</b><br>${payment==='cash'?'💵 Tiền mặt':'🏦 Chuyển khoản / QR'}`;$('success').classList.remove('hide')}catch(e){toast(e.message);b.disabled=false;setPayment(payment)}}api('GET',null,'?action=products').then(d=>{products=d.products||[];render()}).catch(e=>toast(e.message));
</script></body></html>
